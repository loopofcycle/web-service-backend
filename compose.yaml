services:
  db:
    image: postgres:18-alpine
    container_name: postgres_db
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: redis_cache
    restart: always
    ports:
      - "6379:6379"

  backend:
    build: .
    container_name: fastapi_app
    restart: always
    env_file:
      - .env
    volumes:
      - .:/code
      - "${HOST_STORAGE_PATH:-C:/Users/loopo/YandexDisk/_revit_library}:/data/rvt_files"
    command: uvicorn app.main:app --host 0.0.0.0 --port ${APP_PORT:-5000} --reload
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL:-redis://host.docker.internal:6379/0}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - STORAGE_PATH=/data/rvt_files
      - SCAN_PATH=/data/rvt_files
      - MOUNTED_STORAGE_PATH=/data/rvt_files
      - POSTGRES_HOST=db
    ports:
      - "${APP_PORT:-5000}:${APP_PORT:-5000}"
    depends_on:
      - db
      - redis

volumes:
  postgres_data:
